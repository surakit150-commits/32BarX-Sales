<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ติดตามลูกน้อย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;height:100%;}
  :root{
    --bg:#F4F6F2;
    --surface:#FFFFFF;
    --surface-2:#EBF0E7;
    --border:#DCE3D8;
    --text:#22312A;
    --text-muted:#5E6F65;
    --accent:#4C7A92;      /* พ่อ */
    --accent-2:#C97A63;    /* แม่ */
    --accent-soft:#E3ECE8;
    --good:#4C8A57;
    --good-soft:#E1EEE0;
    --warn:#C98A3D;
    --warn-soft:#F5E8D3;
    --danger:#B8574A;
    --shadow: 0 1px 2px rgba(30,45,35,0.06), 0 4px 14px rgba(30,45,35,0.07);
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10140F;
      --surface:#1A2118;
      --surface-2:#212B1E;
      --border:#324033;
      --text:#EAF0E6;
      --text-muted:#9FB29B;
      --accent:#84B7CC;
      --accent-2:#E4A491;
      --accent-soft:#22302B;
      --good:#7FC988;
      --good-soft:#1D2E1F;
      --warn:#E0AE6C;
      --warn-soft:#2E2717;
      --danger:#E28E80;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#10140F;
    --surface:#1A2118;
    --surface-2:#212B1E;
    --border:#324033;
    --text:#EAF0E6;
    --text-muted:#9FB29B;
    --accent:#84B7CC;
    --accent-2:#E4A491;
    --accent-soft:#22302B;
    --good:#7FC988;
    --good-soft:#1D2E1F;
    --warn:#E0AE6C;
    --warn-soft:#2E2717;
    --danger:#E28E80;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.35);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans Thai','IBM Plex Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Mitr','IBM Plex Sans Thai',sans-serif;
    font-weight:600;
    text-wrap:balance;
    margin:0;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100%;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;font-size:15px;}

  /* ---------- Setup screen ---------- */
  #setup-screen{
    padding:32px 20px calc(32px + env(safe-area-inset-bottom,0px));
    display:flex;
    flex-direction:column;
    gap:18px;
    min-height:100vh;
    justify-content:center;
  }
  .setup-badge{
    width:52px;height:52px;border-radius:16px;
    background:var(--accent-soft);
    display:flex;align-items:center;justify-content:center;
    font-family:'Mitr',sans-serif;font-size:24px;color:var(--accent);
  }
  #setup-screen h1{font-size:24px;}
  #setup-screen p{color:var(--text-muted);font-size:14.5px;line-height:1.6;margin:0;}
  .field-label{font-size:13px;font-weight:600;color:var(--text-muted);margin-bottom:6px;display:block;}
  .field{
    width:100%;
    padding:13px 14px;
    border-radius:var(--radius-sm);
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
  }
  .field:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .btn{
    padding:13px 18px;
    border-radius:var(--radius-sm);
    border:none;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
  }
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:active{opacity:0.85;}
  .btn-secondary{background:var(--surface-2);color:var(--text);}
  .btn-ghost{background:transparent;color:var(--accent);padding:8px 4px;font-size:13.5px;}
  .who-choice{display:flex;gap:10px;}
  .who-btn{
    flex:1;padding:14px 10px;border-radius:var(--radius-sm);
    border:1.5px solid var(--border);background:var(--surface);
    color:var(--text);font-weight:600;cursor:pointer;text-align:center;
  }
  .who-btn[data-selected="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
  .who-btn[data-role="mom"][data-selected="true"]{border-color:var(--accent-2);background:color-mix(in srgb, var(--accent-2) 16%, transparent);color:var(--accent-2);}

  /* ---------- Main app ---------- */
  #main-app{display:flex;flex-direction:column;min-height:100vh;}
  .topbar{
    position:relative;
    padding:calc(16px + env(safe-area-inset-top,0px)) 20px 16px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
  }
  .version-badge{
    position:absolute;
    top:calc(10px + env(safe-area-inset-top,0px));
    right:14px;
    font-size:10.5px;font-weight:700;letter-spacing:0.03em;
    color:var(--text-muted);
    background:var(--surface-2);
    padding:3px 8px;border-radius:99px;
    font-variant-numeric:tabular-nums;
  }
  .week-hero{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .week-num{
    font-family:'Mitr',sans-serif;font-weight:700;font-size:40px;
    line-height:1;color:var(--accent);
    font-variant-numeric:tabular-nums;
  }
  .week-num .unit{font-size:16px;font-weight:600;color:var(--text-muted);margin-left:6px;}
  .week-days{font-size:14px;font-weight:600;color:var(--text-muted);}
  .week-sub{font-size:12.5px;color:var(--text-muted);margin-top:4px;width:100%;}
  .due-part{
    margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  }
  .due-part-label{font-size:12px;font-weight:600;color:var(--text-muted);}
  .due-part-value{font-size:14px;font-weight:700;color:var(--text);text-align:right;}
  .due-part-sub{font-size:12px;font-weight:600;color:var(--accent-2);display:block;margin-top:2px;}
  .progress-track{
    margin-top:14px;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;
  }
  .progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));}
  .trimester-row{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-top:6px;}

  main{flex:1;padding:18px 20px calc(96px + env(safe-area-inset-bottom,0px));}
  .section-title{font-size:19px;margin-bottom:14px;}
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    box-shadow:var(--shadow);
  }
  .empty-state{
    text-align:center;padding:36px 16px;color:var(--text-muted);font-size:14px;
    display:flex;flex-direction:column;align-items:center;gap:8px;
  }

  /* size-compare card */
  .size-card{padding:20px;display:flex;gap:16px;align-items:center;margin-bottom:14px;}
  .size-visual{
    width:56px;height:56px;border-radius:16px;flex:none;
    background:var(--accent-soft);display:flex;align-items:center;justify-content:center;
    font-family:'Mitr',sans-serif;font-weight:700;color:var(--accent);font-size:15px;
  }
  .size-card p{margin:0;font-size:13.5px;color:var(--text-muted);line-height:1.5;}
  .size-card strong{color:var(--text);}

  .stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .stat-tile{padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);}
  .stat-tile .num{font-family:'Mitr',sans-serif;font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;}
  .stat-tile .lbl{font-size:12px;color:var(--text-muted);margin-top:2px;}

  /* Add form panel */
  .add-toggle{
    display:flex;align-items:center;justify-content:center;gap:6px;
    width:100%;padding:13px;border-radius:var(--radius-md);
    border:1.5px dashed var(--border);background:transparent;color:var(--accent);
    font-weight:600;font-size:14.5px;cursor:pointer;margin-bottom:14px;
  }
  .add-panel{
    background:var(--surface-2);border-radius:var(--radius-md);
    padding:16px;margin-bottom:16px;display:flex;flex-direction:column;gap:10px;
  }
  .add-panel-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px;}
  .field-row{display:flex;gap:10px;}
  .field-row > div{flex:1;min-width:0;}
  select.field{appearance:auto;-webkit-appearance:menulist;}

  /* Activity list */
  .list{display:flex;flex-direction:column;gap:10px;}
  .activity-item{
    display:flex;gap:12px;padding:14px 16px;align-items:flex-start;
  }
  .type-dot{width:8px;height:8px;border-radius:99px;margin-top:6px;flex:none;}
  .activity-body{flex:1;min-width:0;}
  .activity-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
  .activity-type{font-weight:600;font-size:14.5px;}
  .activity-time{font-size:11.5px;color:var(--text-muted);white-space:nowrap;}
  .activity-note{font-size:13.5px;color:var(--text-muted);margin-top:2px;line-height:1.5;word-break:break-word;}
  .who-tag{
    font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;margin-top:6px;display:inline-block;
  }
  .who-tag.dad{background:var(--accent-soft);color:var(--accent);}
  .who-tag.mom{background:color-mix(in srgb, var(--accent-2) 18%, transparent);color:var(--accent-2);}
  .icon-btn{
    background:none;border:none;color:var(--text-muted);cursor:pointer;
    padding:4px;border-radius:8px;flex:none;
  }
  .icon-btn:hover{background:var(--surface-2);color:var(--danger);}

  /* Checklist */
  .check-item{display:flex;align-items:flex-start;gap:12px;padding:13px 16px;}
  .check-item[data-checked="true"]{background:var(--good-soft);border-radius:var(--radius-sm);}
  .check-col{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;}
  .checkbox{
    width:22px;height:22px;border-radius:7px;border:1.5px solid var(--border);
    flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--surface);
    margin-top:1px;
  }
  .checkbox[data-checked="true"]{background:var(--good);border-color:var(--good);}
  .checkbox svg{display:none;width:14px;height:14px;stroke:#fff;}
  .checkbox[data-checked="true"] svg{display:block;}
  .item-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;padding-top:1px;}
  .check-item .item-name{font-size:14.5px;}
  .item-meta{display:flex;flex-wrap:wrap;gap:6px;}
  .meta-badge{font-size:10.5px;font-weight:600;padding:2.5px 8px;border-radius:99px;white-space:nowrap;line-height:1.4;}
  .meta-badge.age{background:var(--surface-2);color:var(--text-muted);}
  .meta-badge.prio-highest{background:color-mix(in srgb, var(--danger) 18%, transparent);color:var(--danger);}
  .meta-badge.prio-high{background:var(--warn-soft);color:var(--warn);}
  .meta-badge.prio-normal{background:var(--surface-2);color:var(--text-muted);}
  .meta-badge.tobuy{background:color-mix(in srgb, var(--accent) 16%, transparent);color:var(--accent);}
  .meta-badge.tobuy.done{background:var(--good-soft);color:var(--good);}
  .item-price{display:flex;align-items:center;gap:4px;flex:none;align-self:center;}
  .price-currency{font-size:12.5px;color:var(--text-muted);}
  .price-input{
    width:74px;font-size:12.5px;padding:3px 7px;border-radius:7px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);font-family:inherit;
  }
  .price-input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .price-input::placeholder{color:var(--text-muted);}
  .check-item .del-btn{align-self:center;}
  .item-category{font-size:11px;color:var(--text-muted);background:var(--surface-2);padding:2px 8px;border-radius:99px;}
  .category-group{font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;margin:18px 0 8px;}
  .category-group:first-child{margin-top:0;}
  .checklist-progress{font-size:13px;color:var(--text-muted);margin-bottom:14px;}

  /* Checklist sub-tabs (by category) + done filter */
  .prep-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .prep-tab-btn{
    flex:none;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:99px;
    border:1.5px solid var(--border);background:var(--surface);color:var(--text-muted);cursor:pointer;white-space:nowrap;
  }
  .prep-tab-btn[data-active="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
  .prep-tab-btn.prio-highest[data-active="true"]{border-color:var(--danger);background:color-mix(in srgb, var(--danger) 16%, transparent);color:var(--danger);}
  .prep-tab-btn.prio-high[data-active="true"]{border-color:var(--warn);background:var(--warn-soft);color:var(--warn);}
  .prep-tab-btn.prio-normal[data-active="true"]{border-color:var(--text-muted);background:var(--surface-2);color:var(--text);}
  .prep-filter-label{font-size:11.5px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.03em;margin-bottom:6px;}
  .prep-filter-row{display:flex;justify-content:flex-end;margin-bottom:10px;}
  .prep-filter-btn{
    font-size:12.5px;font-weight:600;color:var(--accent);background:none;border:none;cursor:pointer;
    display:flex;align-items:center;gap:4px;padding:4px 2px;
  }

  /* Expenses */
  .expense-item{display:flex;align-items:center;gap:12px;padding:13px 16px;}
  .expense-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
  .expense-date{font-size:13px;font-weight:600;}
  .expense-cat{font-size:11.5px;color:var(--text-muted);}
  .expense-price{font-family:'Mitr',sans-serif;font-weight:700;font-size:15.5px;color:var(--text);white-space:nowrap;}
  .expense-summary{display:flex;flex-direction:column;gap:2px;}
  .expense-summary .num{font-family:'Mitr',sans-serif;font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;color:var(--accent);}
  .expense-summary .lbl{font-size:12.5px;color:var(--text-muted);}

  /* Kicks (นับลูกดิ้น) */
  .kick-summary .num{font-size:16px;font-family:'Mitr',sans-serif;font-weight:700;color:var(--accent);}
  .kick-tap-wrap{display:flex;justify-content:center;margin:6px 0 22px;}
  .kick-tap-btn{
    width:176px;height:176px;border-radius:50%;border:none;cursor:pointer;
    background:linear-gradient(160deg,var(--accent),var(--accent-2));color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    box-shadow:0 10px 26px color-mix(in srgb, var(--accent) 38%, transparent);
    transition:transform .08s ease;
  }
  .kick-tap-btn svg{width:42px;height:42px;}
  .kick-tap-btn span{font-family:'Mitr',sans-serif;font-weight:700;font-size:14.5px;}
  .kick-tap-btn:active{transform:scale(0.94);}
  .kick-tap-btn:disabled{opacity:.65;cursor:default;transform:none;}
  .kick-subtitle{font-size:14.5px;font-weight:700;margin:20px 4px 8px;color:var(--text);}
  .kick-day-card{padding:0;overflow:hidden;margin-bottom:10px;}
  .kick-day-head{
    font-size:12.5px;font-weight:700;color:var(--text-muted);
    padding:12px 16px 6px;text-transform:uppercase;letter-spacing:0.02em;
  }
  .kick-day-today{color:var(--accent);}
  .kick-item{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;}
  .kick-item-main{display:flex;align-items:center;gap:8px;}
  .kick-time{font-family:'Mitr',sans-serif;font-weight:700;font-size:14.5px;font-variant-numeric:tabular-nums;}
  .kick-summary-item{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;font-size:13.5px;}
  .kick-summary-count{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;}

  /* Questions */
  .q-item{padding:15px 16px;display:flex;flex-direction:column;gap:8px;}
  .q-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .q-text{font-size:14.5px;font-weight:500;flex:1;}
  .q-status{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;}
  .q-status.pending{background:var(--warn-soft);color:var(--warn);}
  .q-status.answered{background:var(--good-soft);color:var(--good);}
  .q-answer{
    background:var(--surface-2);border-radius:var(--radius-sm);padding:10px 12px;
    font-size:13.5px;color:var(--text-muted);line-height:1.5;
  }
  .q-answer strong{color:var(--text);}
  .q-meta{font-size:11px;color:var(--text-muted);}
  .answer-form{display:flex;gap:8px;}
  .answer-form input{flex:1;}

  /* Tab bar */
  .tabbar{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:480px;
    background:var(--surface);border-top:1px solid var(--border);
    display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));
    gap:4px;
  }
  .tab-btn{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
    background:none;border:none;padding:8px 4px;border-radius:12px;cursor:pointer;
    color:var(--text-muted);font-size:11px;font-weight:600;
  }
  .tab-btn[data-active="true"]{color:var(--accent);background:var(--accent-soft);}
  .tab-icon{width:20px;height:20px;}

  .banner{
    margin:0 0 14px;padding:12px 14px;border-radius:var(--radius-sm);
    background:var(--warn-soft);color:var(--warn);font-size:13px;line-height:1.5;
    display:flex;justify-content:space-between;gap:10px;align-items:center;
  }
  .banner button{background:none;border:none;color:inherit;font-weight:700;cursor:pointer;font-size:12px;}
  [hidden]{display:none!important;}

  @media (min-width:480px){
    body{background:var(--surface-2);}
    #app{background:var(--bg);box-shadow:var(--shadow);min-height:100vh;}
  }
</style>
</head>
<body>
<div id="app">

  <!-- ============ SETUP SCREEN ============ -->
  <div id="setup-screen" hidden>
    <div class="setup-badge">01</div>
    <h1>Hello World !!! ลลิลลิล</h1>
    <p>แอปนี้เก็บข้อมูลไว้ใน Google Sheet ของครอบครัวเรา วางลิงก์ Web App
      ที่ deploy จาก Apps Script (Code.gs) ไว้ด้านล่าง แล้วเลือกว่าเครื่องนี้เป็นของ พ่อ หรือ แม่</p>

    <div>
      <label class="field-label" for="api-url-input">Web App URL จาก Google Apps Script</label>
      <input class="field" id="api-url-input" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
    </div>

    <div>
      <label class="field-label">เครื่องนี้ใช้โดย</label>
      <div class="who-choice">
        <button class="who-btn" data-role="dad" data-selected="false" type="button">พ่อ</button>
        <button class="who-btn" data-role="mom" data-selected="false" type="button">แม่</button>
      </div>
    </div>

    <p id="setup-error" style="color:var(--danger);" hidden></p>

    <button class="btn btn-primary" id="setup-save-btn" type="button">เริ่มใช้งาน</button>
  </div>

  <!-- ============ MAIN APP ============ -->
  <div id="main-app" hidden>

    <header class="topbar">
      <span class="version-badge">V1.2</span>
      <div class="week-hero">
        <span class="week-num" id="week-num">—<span class="unit">สัปดาห์</span></span>
        <span class="week-days" id="week-days"></span>
        <span class="week-sub" id="week-sub">Hello World !!!</span>
      </div>
      <div class="due-part">
        <span class="due-part-label">กำหนดคลอด</span>
        <span class="due-part-value" id="due-part-value">ยังไม่ได้ตั้งค่า
          <span class="due-part-sub" id="due-part-sub"></span>
        </span>
      </div>

    );
  }
  function wireDropdownWithAdd(id){
    var sel = document.getElementById(id+'-select');

    if (!sel || !inp) return;

      if (sel.value === '__new__') { inp.style.display = 'block'; inp.focus(); }
      else { inp.style.display = 'none'; inp.value = ''; }
    });
  }

  // ---------------- Pregnancy math ----------------
  function pad(n){ return n<10 ? '0'+n : ''+n; }

  // Dates are stored and transmitted as plain "epoch day" integers (days
  // since 1970-01-01), NEVER as "YYYY-MM-DD" strings. Google Sheets silently
  // auto-converts date-looking text into real Date cells, which then comes
  // back corrupted (shifted by the sheet's timezone) and breaks re-parsing.
  // A plain integer like "20711" doesn't match any date pattern Sheets
  // auto-detects, so it's stored exactly as sent — immune to that bug.
  function toEpochDay(y, m, d){ return Math.floor(Date.UTC(y, m, d) / 86400000); }
  function dateStrToEpochDay(s){ // s = "YYYY-MM-DD" from an <input type="date">
    var p = s.split('-').map(Number);
    return toEpochDay(p[0], p[1]-1, p[2]);
  }
  function epochDayToDate(n){ return new Date(n * 86400000); } // UTC-midnight instant
  function epochDayToInputValue(n){
    var d = epochDayToDate(n);
    return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());
  }
  function localTodayEpochDay(){
    var n = new Date();
    return toEpochDay(n.getFullYear(), n.getMonth(), n.getDate());
  }
  // Robustly reads an epoch-day setting: accepts the new plain-integer format,
  // and also tolerates an already-corrupted date/datetime string left over
  // from before this fix, so old data doesn't crash the page.
  function parseEpochDaySetting(v){
    if (v === undefined || v === null || v === '') return null;
    var s = String(v);
    if (s.indexOf('-') === -1 && s.indexOf('T') === -1){
      var n = Math.round(Number(s));
      return isNaN(n) ? null : n;
    }
    var datePart = s.split('T')[0];
    var p = datePart.split('-').map(Number);
    if (p.length === 3 && !p.some(isNaN)) return toEpochDay(p[0], p[1]-1, p[2]);
    return null;
  }

  function fmtDateTh(d){
    var months=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
    return d.getUTCDate()+' '+months[d.getUTCMonth()]+' '+(d.getUTCFullYear()+543);
  }
  function fmtDateTimeTh(iso){
    var d = new Date(iso);
    if (isNaN(d)) return '';
    var months=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
    return d.getDate()+' '+months[d.getMonth()]+' • '+pad(d.getHours())+':'+pad(d.getMinutes());
  }
  // แสดงผลวันที่แบบไทย (ไม่มีเวลา) จาก Date instant จริง โดยใช้เวลาท้องถิ่นของเครื่อง
  // (ต่างจาก fmtDateTh ที่ใช้ getUTC* — อันนั้นสำหรับค่า "epoch day" ที่ไม่มี timezone)
  function fmtDateThLocal(d){
    var months=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
    return d.getDate()+' '+months[d.getMonth()]+' '+(d.getFullYear()+543);
  }
  // คีย์วันที่ท้องถิ่นแบบ "YYYY-MM-DD" ไว้ใช้จัดกลุ่มรายการตามวัน (เทียบกันด้วย string ได้ตรงๆ)
  function localDateKeyFromDate(d){
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }

  // Current week/day comes from a reference "anchor" (a date + the gestational
  // age confirmed on that date, e.g. by a doctor) and keeps counting forward.
  // Due-date countdown is independent — it's whatever due date was entered,
  // shown as its own part of the page, not re-derived from the anchor.
  function pregnancyInfo(){
    var s = state.settings || {};
    var todayDay = localTodayEpochDay();

    var weeks = null, days = null, gestDaysToday = null;

    var anchorDay = parseEpochDaySetting(s.AnchorDate);
    var aw = (s.AnchorWeeks !== undefined && s.AnchorWeeks !== '') ? parseInt(s.AnchorWeeks, 10) : NaN;
    var ad = parseInt(s.AnchorDays, 10); if (isNaN(ad)) ad = 0;

    if (anchorDay !== null && !isNaN(aw)){
      var elapsed = todayDay - anchorDay;
      gestDaysToday = Math.max(0, aw*7 + ad + elapsed);
      weeks = Math.floor(gestDaysToday/7);
      days = gestDaysToday % 7;
    }

    var dueDay = parseEpochDaySetting(s.DueDate);
    var dueDate = null, daysUntilDue = null;
    if (dueDay !== null){
      dueDate = epochDayToDate(dueDay);
      daysUntilDue = dueDay - todayDay;
      if (weeks === null){
        // no anchor set — fall back to deriving current week from due date
        gestDaysToday = 280 - daysUntilDue;
        weeks = Math.max(0, Math.floor(gestDaysToday/7));
        days = Math.max(0, gestDaysToday % 7);
      }
    }

    if (weeks === null && dueDate === null) return null;

    var trimester = weeks !== null ? (weeks < 14 ? 1 : (weeks < 28 ? 2 : 3)) : null;
    var percent = gestDaysToday !== null ? Math.min(100, Math.max(0, (gestDaysToday/280)*100)) : null;
    var sizeLabel = null;
    if (weeks !== null){
      sizeLabel = SIZE_TABLE[0].label;
      for (var i=0;i<SIZE_TABLE.length;i++){ if (weeks >= SIZE_TABLE[i].w) sizeLabel = SIZE_TABLE[i].label; }
    }
    return {weeks:weeks, days:days, dueDate:dueDate, daysUntilDue:daysUntilDue, trimester:trimester, percent:percent, sizeLabel:sizeLabel};
  }

  // ---------------- Topbar ----------------
  function renderTopbar(){
    var info = pregnancyInfo();
    var weekNumEl = document.getElementById('week-num');
    var weekDaysEl = document.getElementById('week-days');
    var weekSubEl = document.getElementById('week-sub');
    var dueValEl = document.getElementById('due-part-value');
    var dueSubEl = document.getElementById('due-part-sub');
    var fill = document.getElementById('progress-fill');

    if (!info){
      weekNumEl.innerHTML = '—<span class="unit">สัปดาห์</span>';
      weekDaysEl.textContent = '';
      weekSubEl.textContent = 'ยังไม่ได้ตั้งค่าอายุครรภ์';
      dueValEl.innerHTML = 'ยังไม่ได้ตั้งค่า';
      fill.style.width = '0%';
      return;
    }

    if (info.weeks !== null){
      weekNumEl.innerHTML = info.weeks + '<span class="unit">สัปดาห์</span>';
      weekDaysEl.textContent = info.days + ' วัน';
      weekSubEl.textContent = 'นับถึงวันนี้';

      weekNumEl.innerHTML = '—<span class="unit">สัปดาห์</span>';
      weekDaysEl.textContent = '';
      weekSubEl.textContent = '';
    }

    if (info.dueDate){
      var sub = info.daysUntilDue >= 0
        ? 'อีก '+info.daysUntilDue+' วัน'
        : 'เลยกำหนดมาแล้ว '+Math.abs(info.daysUntilDue)+' วัน';
      dueValEl.innerHTML = fmtDateTh(info.dueDate) + '<span class="due-part-sub">'+sub+'</span>';
    } else {
      dueValEl.innerHTML = 'ยังไม่ได้ตั้งค่า';
    }

    fill.style.width = (info.percent || 0) + '%';
  }

  // Setup/edit card for the reference (anchor) week/day + due date.
  // editMode=true prefills with current values and labels itself as an edit form.
  // ทราบมาแล้วว่า ณ 15 ก.ย. 2569 อายุครรภ์ 27 สัปดาห์ 3 วัน และกำหนดคลอดคาดการณ์คือ 14 ธ.ค. 2569
  // ใช้ค่านี้เป็นค่าเริ่มต้นในฟอร์ม (ตอนยังไม่เคยบันทึกอะไรเลย) จะได้ไม่ต้องพิมพ์เอง กดบันทึกทีเดียวจบ
  var KNOWN_DEFAULTS = { anchorDate:'2026-09-15', anchorWeeks:'27', anchorDays:'3', dueDate:'2026-12-14' };

  function pregnancySetupCard(editMode){
    var s = state.settings || {};
    var anchorDayVal = parseEpochDaySetting(s.AnchorDate);
    var dueDayVal = parseEpochDaySetting(s.DueDate);
    var hasAnyData = anchorDayVal !== null || dueDayVal !== null;

    var anchorDateInput = anchorDayVal !== null ? epochDayToInputValue(anchorDayVal) : (hasAnyData ? '' : KNOWN_DEFAULTS.anchorDate);
    var anchorWeeksInput = s.AnchorWeeks !== undefined ? s.AnchorWeeks : (hasAnyData ? '' : KNOWN_DEFAULTS.anchorWeeks);
    var anchorDaysInput = s.AnchorDays !== undefined ? s.AnchorDays : (hasAnyData ? '' : KNOWN_DEFAULTS.anchorDays);
    var dueDateInput = dueDayVal !== null ? epochDayToInputValue(dueDayVal) : (hasAnyData ? '' : KNOWN_DEFAULTS.dueDate);

    var card = el('div','card add-panel');
    card.innerHTML =
      '<span class="field-label">'+(editMode ? 'แก้ไขอายุครรภ์ปัจจุบัน' : 'อายุครรภ์ ณ วันที่ทราบล่าสุด')+'</span>'+
      '<div style="display:flex;gap:8px;">'+
        '<input class="field" type="date" id="anchor-date" style="flex:2" value="'+anchorDateInput+'">'+
        '<input class="field" type="number" id="anchor-weeks" min="0" max="45" placeholder="สัปดาห์" style="flex:1" value="'+anchorWeeksInput+'">'+
        '<input class="field" type="number" id="anchor-days" min="0" max="6" placeholder="วัน" style="flex:1" value="'+anchorDaysInput+'">'+
      '</div>'+
      '<span class="field-label" style="margin-top:6px;">กำหนดคลอด (คาดการณ์)</span>'+
      '<input class="field" type="date" id="due-date-field" value="'+dueDateInput+'">'+
      '<button class="btn btn-primary" id="save-pregnancy-btn" type="button">บันทึก</button>';
    card.querySelector('#save-pregnancy-btn').onclick = function(){
      var anchorDate = document.getElementById('anchor-date').value;
      var anchorWeeks = document.getElementById('anchor-weeks').value;
      var anchorDays = document.getElementById('anchor-days').value;
      var dueDate = document.getElementById('due-date-field').value;
      var toSave = {};
      if (anchorDate && anchorWeeks !== '') {
        toSave.AnchorDate = String(dateStrToEpochDay(anchorDate));
        toSave.AnchorWeeks = anchorWeeks;
        toSave.AnchorDays = anchorDays || '0';
      }
      if (dueDate) toSave.DueDate = String(dateStrToEpochDay(dueDate));
      if (!Object.keys(toSave).length) return;
      var btn = document.getElementById('save-pregnancy-btn');
      btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
      saveSettings(toSave).then(refresh).catch(function(err){
        btn.disabled = false; btn.textContent = 'บันทึก';
        showBanner('บันทึกไม่สำเร็จ: '+err.message+' — เช็คว่าอัปเดต Code.gs เวอร์ชันใหม่ (มี action "setSetting") และกด Deploy > Manage deployments > New version แล้วหรือยัง');
      });
    };
    return card;
  }

  // ---------------- Kicks (นับลูกดิ้น) ----------------
  function renderKicks(root){
    root.appendChild(el('h2','section-title','นับลูกดิ้น'));

    var kicks = (state.kicks||[]).slice().sort(function(a,b){ return new Date(b.Timestamp) - new Date(a.Timestamp); });
    var todayKey = localDateKeyFromDate(new Date());
    var todayCount = kicks.filter(function(k){ return localDateKeyFromDate(new Date(k.Timestamp)) === todayKey; }).length;
    var lastKick = kicks[0];

    var summary = el('div','stat-row');
    summary.innerHTML =
      '<div class="stat-tile kick-summary"><div class="num">'+todayCount+'</div><div class="lbl">จำนวนครั้งวันนี้</div></div>'+
      '<div class="stat-tile kick-summary"><div class="num">'+(lastKick ? fmtDateTimeTh(lastKick.Timestamp) : '—')+'</div><div class="lbl">ครั้งล่าสุด</div></div>';
    root.appendChild(summary);

    var tapWrap = el('div','kick-tap-wrap');
    tapWrap.innerHTML =
      '<button class="kick-tap-btn" id="kick-tap-btn" type="button">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12h3l2-7 4 14 3-10 2 3h4"/></svg>'+
        '<span>กดเมื่อลูกดิ้น</span>'+
      '</button>';
    root.appendChild(tapWrap);
    var tapBtn = tapWrap.querySelector('#kick-tap-btn');
    tapBtn.onclick = function(){
      tapBtn.disabled = true;
      apiPost('addKick', {loggedBy:who}).then(function(res){
        if (!res || !res.ok) { tapBtn.disabled = false; showBanner('บันทึกไม่สำเร็จ: ' + ((res && res.error) || '')); return; }
        refresh();
      }).catch(function(){
        tapBtn.disabled = false;
        showBanner('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง');
      });
    };

    if (!kicks.length){
      root.appendChild(emptyState('ยังไม่มีการบันทึกลูกดิ้น','กดปุ่มด้านบนทุกครั้งที่รู้สึกว่าลูกดิ้น'));
      return;
    }

    // จัดกลุ่มรายการดิบตามวัน (ใหม่สุดก่อน เพราะ kicks ถูก sort ไว้แล้ว)
    var groups = [];
    var groupMap = {};
    kicks.forEach(function(k){
      var d = new Date(k.Timestamp);
      var key = localDateKeyFromDate(d);
      if (!groupMap[key]) { groupMap[key] = { key:key, date:d, items:[] }; groups.push(groupMap[key]); }
      groupMap[key].items.push(k);
    });

    root.appendChild(el('h3','kick-subtitle','ประวัติการกด'));
    groups.forEach(function(g){
      var dayCard = el('div','card kick-day-card');
      dayCard.appendChild(el('div','kick-day-head', escapeHtml(fmtDateThLocal(g.date)) + (g.key===todayKey ? ' <span class="kick-day-today">(วันนี้)</span>' : '')));
      var list = el('div','list');
      g.items.forEach(function(item, i){
        var d = new Date(item.Timestamp);
        var row = el('div','kick-item');
        if (i>0) row.style.borderTop = '1px solid var(--border)';
        row.innerHTML =
          '<div class="kick-item-main"><span class="kick-time">'+pad(d.getHours())+':'+pad(d.getMinutes())+'</span>'+whoTag(item.LoggedBy)+'</div>'+
          '<button class="icon-btn del-btn" type="button" aria-label="ลบ" title="ลบ">'+trashIcon()+'</button>';
        row.querySelector('.del-btn').onclick = function(){
          apiPost('deleteKick', {id:item.ID}).then(refresh);
        };
        list.appendChild(row);
      });
      dayCard.appendChild(list);
      root.appendChild(dayCard);
    });

    // สรุปจำนวนครั้งต่อวัน (ใหม่สุดก่อน)
    root.appendChild(el('h3','kick-subtitle','สรุปรายวัน'));
    var summaryList = el('div','list card');
    groups.forEach(function(g, i){
      var row = el('div','kick-summary-item');
      if (i>0) row.style.borderTop = '1px solid var(--border)';
      row.innerHTML =
        '<span>'+escapeHtml(fmtDateThLocal(g.date))+(g.key===todayKey ? ' <span class="kick-day-today">(วันนี้)</span>' : '')+'</span>'+
        '<span class="kick-summary-count">'+g.items.length+' ครั้ง</span>';
      summaryList.appendChild(row);
    });
    root.appendChild(summaryList);
  }

  // ---------------- Prep (Checklist) ----------------
  function renderPrep(root){
    root.appendChild(el('h2','section-title','ของที่ต้องเตรียม'));

    var items = state.checklist || [];
    var doneCount = items.filter(function(i){ return i.Done===true || i.Done==='TRUE'; }).length;
    if (items.length){
      var totalPrice = items.reduce(function(sum, i){
        var n = parseFloat(String(i.Price).replace(/,/g,''));
        return isFinite(n) ? sum + n : sum;
      }, 0);
      var progressText = 'เตรียมแล้ว '+doneCount+' จาก '+items.length+' รายการ';
      if (totalPrice > 0) progressText += ' · ราคารวมที่กรอกไว้ ฿'+totalPrice.toLocaleString('th-TH');
      root.appendChild(el('div','checklist-progress', progressText));
    }

    var toggle = el('button','add-toggle','+ เพิ่มของที่ต้องเตรียม');
    toggle.onclick = function(){ openAddPanel = (openAddPanel==='prep') ? null : 'prep'; renderView(); };
    root.appendChild(toggle);

    if (openAddPanel === 'prep'){
      var panel = el('div','add-panel');
      panel.innerHTML =
        '<span class="field-label">ชื่อของ</span>'+
        '<input class="field" id="item-name" placeholder="เช่น เสื้อผ้าเด็กแรกเกิด">'+
        '<span class="field-label">หมวดหมู่ (ไม่บังคับ)</span>'+
        dropdownWithAddHtml('item-cat', getKnownCategories(), 'พิมพ์หมวดหมู่ใหม่')+
        '<div class="field-row">'+
          '<div>'+
            '<span class="field-label">ช่วงวัย (ไม่บังคับ)</span>'+
            dropdownWithAddHtml('item-age', getKnownAges(), 'พิมพ์ช่วงวัยใหม่ เช่น NB-3M')+
          '</div>'+
          '<div>'+
            '<span class="field-label">ความสำคัญ (ไม่บังคับ)</span>'+
            '<select class="field" id="item-prio">'+
              '<option value="">ไม่ระบุ</option>'+
              '<option value="Highest">จำเป็นมาก</option>'+
              '<option value="High">สำคัญ</option>'+
              '<option value="Normal">ทั่วไป</option>'+
            '</select>'+
          '</div>'+
        '</div>'+
        '<div class="field-row">'+
          '<div>'+
            '<span class="field-label">จำนวนที่ต้องซื้อ (ไม่บังคับ)</span>'+
            '<input class="field" id="item-qty" type="number" min="0" inputmode="numeric" placeholder="เช่น 2">'+
          '</div>'+
          '<div>'+
            '<span class="field-label">ราคา (ไม่บังคับ)</span>'+
            '<input class="field" id="item-price" type="text" inputmode="decimal" placeholder="เช่น 250">'+
          '</div>'+
        '</div>'+
        '<div class="add-panel-actions">'+
          '<button class="btn btn-secondary" id="item-cancel" type="button">ยกเลิก</button>'+
          '<button class="btn btn-primary" id="item-save" type="button">เพิ่ม</button>'+
        '</div>';
      root.appendChild(panel);
      wireDropdownWithAdd('item-cat');
      wireDropdownWithAdd('item-age');
      panel.querySelector('#item-cancel').onclick = function(){ openAddPanel=null; renderView(); };
      panel.querySelector('#item-save').onclick = function(){
        var name = document.getElementById('item-name').value.trim();
        var cat = readDropdownWithAdd('item-cat');
        var age = readDropdownWithAdd('item-age');
        var prio = document.getElementById('item-prio').value;
        var qty = document.getElementById('item-qty').value.trim();
        var price = document.getElementById('item-price').value.trim();
        if (!name) return;
        apiPost('addChecklistItem', {item:name, category:cat, addedBy:who, age:age, priority:prio, qty:qty, price:price}).then(function(){
          openAddPanel = null;
          refresh();
        });
      };
    }

    if (!items.length){
      var importCard = el('div','card', '');
      importCard.style.padding = '16px';
      importCard.style.marginBottom = '14px';
      importCard.innerHTML =
        '<div style="font-weight:600;font-size:14.5px;margin-bottom:4px;">นำเข้ารายการจาก Lalinlin Essentials</div>'+
        '<p style="margin:0 0 12px;font-size:13px;color:var(--text-muted);line-height:1.5;">'+
        'นำเข้ารายการของเตรียมคลอด/เตรียมลูก '+PRESET_CHECKLIST.length+' รายการ จัดหมวดหมู่ไว้ให้แล้ว '+
        '(รายการที่ซื้อแล้วตามชีทเดิมจะถูกติ๊กว่าเตรียมแล้วให้อัตโนมัติ)</p>'+
        '<button class="btn btn-primary" id="import-preset-btn" type="button" style="width:100%;">นำเข้า '+PRESET_CHECKLIST.length+' รายการ</button>';
      importCard.querySelector('#import-preset-btn').onclick = function(){
        var btn = importCard.querySelector('#import-preset-btn');
        btn.disabled = true;
        bulkImportChecklist(function(done, total){
          btn.textContent = 'กำลังนำเข้า... ('+done+'/'+total+')';
        }).then(refresh).catch(function(err){
          btn.disabled = false;
          btn.textContent = 'นำเข้า '+PRESET_CHECKLIST.length+' รายการ';
          showBanner('นำเข้าไม่สำเร็จบางรายการ: '+err.message+' — ลองกดใหม่อีกครั้ง (รายการที่นำเข้าไปแล้วจะไม่ซ้ำซ้อนมาก แต่ควรเช็คในลิสต์)');
        });
      };
      root.appendChild(importCard);
      root.appendChild(emptyState('ยังไม่มีรายการของที่ต้องเตรียม','หรือกดปุ่ม "+ เพิ่มของที่ต้องเตรียม" ด้านบนเพื่อเพิ่มเอง'));
      return;
    }

    var groups = {};
    var order = [];
    items.forEach(function(i){
      var cat = i.Category || 'ทั่วไป';
      if (!groups[cat]) { groups[cat]=[]; order.push(cat); }
      groups[cat].push(i);
    });

    // รีเซ็ต tab ถ้าหมวดที่เลือกไว้หายไปแล้ว (เช่น ลบของชิ้นสุดท้ายในหมวดนั้น)
    if (prepActiveCat !== 'all' && order.indexOf(prepActiveCat) === -1) prepActiveCat = 'all';

    // ---- Tabs ตามหมวดหมู่ ----
    var tabsBar = el('div','prep-tabs');
    var allTabBtn = el('button','prep-tab-btn','ทั้งหมด');
    allTabBtn.type = 'button';
    allTabBtn.setAttribute('data-active', String(prepActiveCat==='all'));
    allTabBtn.onclick = function(){ prepActiveCat='all'; renderView(); };
    tabsBar.appendChild(allTabBtn);
    order.forEach(function(cat){
      var tabBtn = el('button','prep-tab-btn', escapeHtml(cat));
      tabBtn.type = 'button';
      tabBtn.setAttribute('data-active', String(prepActiveCat===cat));
      tabBtn.onclick = function(){ prepActiveCat=cat; renderView(); };
      tabsBar.appendChild(tabBtn);
    });
    root.appendChild(tabsBar);

    // ---- Filter ตามระดับความสำคัญ ----
    root.appendChild(el('div','prep-filter-label','ความสำคัญ'));
    var prioBar = el('div','prep-tabs');
    var PRIO_FILTERS = [
      {key:'all', label:'ทั้งหมด', cls:''},
      {key:'Highest', label:'จำเป็นมาก', cls:'prio-highest'},
      {key:'High', label:'สำคัญ', cls:'prio-high'},
      {key:'Normal', label:'ทั่วไป', cls:'prio-normal'}
    ];
    PRIO_FILTERS.forEach(function(opt){
      var prioBtn = el('button','prep-tab-btn'+(opt.cls?' '+opt.cls:''), opt.label);
      prioBtn.type = 'button';
      prioBtn.setAttribute('data-active', String(prepActivePrio===opt.key));
      prioBtn.onclick = function(){ prepActivePrio=opt.key; renderView(); };
      prioBar.appendChild(prioBtn);
    });
    root.appendChild(prioBar);

    // ---- ปุ่มซ่อน/แสดงรายการที่ซื้อแล้ว ----
    var filterRow = el('div','prep-filter-row');
    var filterBtn = el('button','prep-filter-btn', prepHideDone ? 'แสดงรายการที่ซื้อแล้ว' : 'ซ่อนรายการที่ซื้อแล้ว');
    filterBtn.type = 'button';
    filterBtn.onclick = function(){ prepHideDone = !prepHideDone; renderView(); };
    filterRow.appendChild(filterBtn);
    root.appendChild(filterRow);

    var catsToRender = prepActiveCat === 'all' ? order : [prepActiveCat];
    var anyRendered = false;

    catsToRender.forEach(function(cat){
      var catItems = groups[cat] || [];
      if (prepHideDone) catItems = catItems.filter(function(i){ return !(i.Done===true || i.Done==='TRUE'); });
      if (prepActivePrio !== 'all') {
        catItems = catItems.filter(function(i){
          var r = resolveChecklistItem(i);
          return r.meta && r.meta.prio === prepActivePrio;
        });
      }
      if (!catItems.length) return;
      anyRendered = true;

      if (prepActiveCat === 'all') root.appendChild(el('div','category-group', escapeHtml(cat)));
      var list = el('div','list card');
      catItems.forEach(function(item,i){
        var checked = item.Done===true || item.Done==='TRUE';
        var row = el('div','check-item');
        row.setAttribute('data-checked', checked);
        if (i>0) row.style.borderTop = '1px solid var(--border)';

        var resolved = resolveChecklistItem(item);
        var prioHtml = '';
        var metaHtml = '';
        if (resolved.meta) {
          if (resolved.meta.prio) {
            var prio = PRIORITY_LABELS[resolved.meta.prio] || {th: resolved.meta.prio, cls:'prio-normal'};
            prioHtml = '<span class="meta-badge '+prio.cls+'">'+escapeHtml(prio.th)+'</span>';
          }
          var tobuyLabel = checked ? 'ซื้อครบแล้ว' : ('ต้องซื้อ' + (resolved.meta.toBuy ? ' ' + resolved.meta.toBuy + ' ชิ้น' : ''));
          metaHtml =
            '<div class="item-meta">'+
              (resolved.meta.age ? '<span class="meta-badge age">อายุ '+escapeHtml(resolved.meta.age)+'</span>' : '')+
              '<span class="meta-badge tobuy'+(checked?' done':'')+'">'+escapeHtml(tobuyLabel)+'</span>'+
            '</div>';
        }

        var priceVal = (item.Price !== undefined && item.Price !== null && item.Price !== '') ? item.Price : '';
        var priceHtml =
          '<div class="item-price">'+
            '<span class="price-currency">฿</span>'+
            '<input class="price-input" type="text" inputmode="decimal" placeholder="ใส่ราคา" value="'+escapeHtml(String(priceVal))+'">'+
          '</div>';

        row.innerHTML =
          '<div class="check-col">'+
            '<button class="checkbox" data-checked="'+checked+'" type="button" aria-label="ทำเครื่องหมาย">'+
              '<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'+
            '</button>'+
            prioHtml+
          '</div>'+
          '<div class="item-main">'+
            '<span class="item-name">'+escapeHtml(resolved.name)+'</span>'+
            metaHtml+
          '</div>'+
          priceHtml+
          '<button class="icon-btn del-btn" type="button" aria-label="ลบ" title="ลบ">'+trashIcon()+'</button>';
        row.querySelector('.checkbox').onclick = function(){
          apiPost('toggleChecklist', {id:item.ID, done: !checked}).then(refresh);
        };
        row.querySelector('.del-btn').onclick = function(){
          apiPost('deleteChecklistItem', {id:item.ID}).then(refresh);
        };
        var priceInput = row.querySelector('.price-input');
        priceInput.addEventListener('click', function(e){ e.stopPropagation(); });
        priceInput.addEventListener('change', function(){
          var val = priceInput.value.trim();
          apiPost('setChecklistPrice', {id:item.ID, price: val}).then(function(res){
            if (!res || !res.ok) { showBanner('บันทึกราคาไม่สำเร็จ ลองใหม่อีกครั้ง'); return; }
            item.Price = val;
            var progressEl = root.querySelector('.checklist-progress');
            if (progressEl) {
              var totalPrice = items.reduce(function(sum, i){
                var n = parseFloat(String(i.Price).replace(/,/g,''));
                return isFinite(n) ? sum + n : sum;
              }, 0);
              var doneNow = items.filter(function(i){ return i.Done===true || i.Done==='TRUE'; }).length;
              var txt = 'เตรียมแล้ว '+doneNow+' จาก '+items.length+' รายการ';
              if (totalPrice > 0) txt += ' · ราคารวมที่กรอกไว้ ฿'+totalPrice.toLocaleString('th-TH');
              progressEl.textContent = txt;
            }
          }).catch(function(){ showBanner('บันทึกราคาไม่สำเร็จ ลองใหม่อีกครั้ง'); });
        });
        list.appendChild(row);
      });
      root.appendChild(list);
    });

    if (!anyRendered) {
      var hints = [];
      if (prepHideDone) hints.push('กดปุ่ม "แสดงรายการที่ซื้อแล้ว"');
      if (prepActivePrio !== 'all') hints.push('เปลี่ยน filter ความสำคัญเป็น "ทั้งหมด"');
      root.appendChild(emptyState(
        (prepHideDone || prepActivePrio !== 'all') ? 'ไม่พบรายการที่ตรงกับตัวกรอง' : 'ยังไม่มีรายการในหมวดนี้',
        hints.length ? ('ลอง ' + hints.join(' หรือ ') + ' ดูครับ') : ''
      ));
    }
  }

  // ---------------- Ask (Questions) ----------------
  function renderAsk(root){
    root.appendChild(el('h2','section-title','คำถามที่จะถามหมอ'));

    var toggle = el('button','add-toggle','+ เพิ่มคำถาม');
    toggle.onclick = function(){ openAddPanel = (openAddPanel==='ask') ? null : 'ask'; renderView(); };
    root.appendChild(toggle);

    if (openAddPanel === 'ask'){
      var panel = el('div','add-panel');
      panel.innerHTML =
        '<span class="field-label">คำถาม</span>'+
        '<textarea class="field" id="q-text" rows="2" placeholder="เช่น ลูกดิ้นน้อยลงต้องกังวลไหม"></textarea>'+
        '<div class="add-panel-actions">'+
          '<button class="btn btn-secondary" id="q-cancel" type="button">ยกเลิก</button>'+
          '<button class="btn btn-primary" id="q-save" type="button">เพิ่มคำถาม</button>'+
        '</div>';
      root.appendChild(panel);
      panel.querySelector('#q-cancel').onclick = function(){ openAddPanel=null; renderView(); };
      panel.querySelector('#q-save').onclick = function(){
        var text = document.getElementById('q-text').value.trim();
        if (!text) return;
        apiPost('addQuestion', {question:text, askedBy:who}).then(function(){
          openAddPanel=null;
          refresh();
        });
      };
    }

    var items = (state.questions||[]).slice().sort(function(a,b){
      var aAns = a.Answered===true || a.Answered==='TRUE';
      var bAns = b.Answered===true || b.Answered==='TRUE';
      if (aAns !== bAns) return aAns ? 1 : -1;
      return new Date(b.Timestamp) - new Date(a.Timestamp);
    });

    if (!items.length){
      root.appendChild(emptyState('ยังไม่มีคำถาม','รวบรวมคำถามที่อยากถามหมอไว้ที่นี่ จะได้ไม่ลืมตอนถึงเวลานัด'));
      return;
    }

    items.forEach(function(item){
      var answered = item.Answered===true || item.Answered==='TRUE';
      var card = el('div','card q-item');
      card.innerHTML =
        '<div class="q-top">'+
          '<span class="q-text">'+escapeHtml(item.Question)+'</span>'+
          '<span class="q-status '+(answered?'answered':'pending')+'">'+(answered?'ตอบแล้ว':'รอถาม')+'</span>'+
        '</div>'+
        '<div class="q-meta">'+whoTag(item.AskedBy)+' <span>'+fmtDateTimeTh(item.Timestamp)+'</span></div>';

      if (answered && item.Answer){
        var ans = el('div','q-answer','<strong>คำตอบจากหมอ: </strong>'+escapeHtml(item.Answer));
        card.appendChild(ans);
      }

      var actions = el('div','add-panel-actions');
      if (!answered){
        var form = el('div','answer-form');
        form.innerHTML = '<input class="field" placeholder="พิมพ์คำตอบจากหมอ...">';
        var saveBtn = el('button','btn btn-primary','บันทึก');
        form.appendChild(saveBtn);
        saveBtn.onclick = function(){
          var v = form.querySelector('input').value.trim();
          if (!v) return;
          apiPost('answerQuestion', {id:item.ID, answer:v}).then(refresh);
        };
        card.appendChild(form);
      } else {
        var reopenBtn = el('button','btn-ghost','เปิดใหม่');
        reopenBtn.onclick = function(){ apiPost('reopenQuestion', {id:item.ID}).then(refresh); };
        actions.appendChild(reopenBtn);
      }
      var delBtn = el('button','btn-ghost','ลบคำถาม');
      delBtn.style.color = 'var(--danger)';
      delBtn.onclick = function(){ apiPost('deleteQuestion', {id:item.ID}).then(refresh); };
      actions.appendChild(delBtn);
      card.appendChild(actions);

      root.appendChild(card);
    });
  }

  // ---------------- Expenses (รวมค่าใช้จ่าย) ----------------
  function renderExpenses(root){
    root.appendChild(el('h2','section-title','รวมค่าใช้จ่าย'));

    var expenses = state.expenses || [];
    var total = expenses.reduce(function(sum, e){
      var n = parseFloat(String(e.Price).replace(/,/g,''));
      return isFinite(n) ? sum + n : sum;
    }, 0);

    var summary = el('div','stat-row');
    summary.innerHTML =
      '<div class="stat-tile expense-summary"><div class="num">฿'+total.toLocaleString('th-TH')+'</div><div class="lbl">ยอดรวมทั้งหมด</div></div>'+
      '<div class="stat-tile expense-summary"><div class="num">'+expenses.length+'</div><div class="lbl">จำนวนรายการ</div></div>';
    root.appendChild(summary);

    var toggle = el('button','add-toggle','+ เพิ่มรายการค่าใช้จ่าย');
    toggle.onclick = function(){ openAddPanel = (openAddPanel==='expenses') ? null : 'expenses'; renderView(); };
    root.appendChild(toggle);

    if (openAddPanel === 'expenses'){
      var panel = el('div','add-panel');
      var todayVal = epochDayToInputValue(localTodayEpochDay());
      panel.innerHTML =
        '<span class="field-label">หมวดหมู่</span>'+
        dropdownWithAddHtml('exp-cat', getKnownExpenseCategories(), 'พิมพ์หมวดหมู่ใหม่')+
        '<span class="field-label">วันที่จ่าย</span>'+
        '<input class="field" id="exp-date" type="date" value="'+todayVal+'">'+
        '<span class="field-label">ราคา</span>'+
        '<input class="field" id="exp-price" type="text" inputmode="decimal" placeholder="เช่น 350">'+
        '<div class="add-panel-actions">'+
          '<button class="btn btn-secondary" id="exp-cancel" type="button">ยกเลิก</button>'+
          '<button class="btn btn-primary" id="exp-save" type="button">เพิ่ม</button>'+
        '</div>';
      root.appendChild(panel);
      wireDropdownWithAdd('exp-cat');
      panel.querySelector('#exp-cancel').onclick = function(){ openAddPanel=null; renderView(); };
      panel.querySelector('#exp-save').onclick = function(){
        var cat = readDropdownWithAdd('exp-cat');
        var dateVal = document.getElementById('exp-date').value;
        var price = document.getElementById('exp-price').value.trim();
        if (!price) { showBanner('กรุณาใส่ราคา'); return; }
        var dateEpoch = dateVal ? dateStrToEpochDay(dateVal) : '';
        apiPost('addExpense', {category:cat, date:dateEpoch, price:price, addedBy:who}).then(function(res){
          if (!res || !res.ok) { showBanner('บันทึกไม่สำเร็จ: ' + ((res && res.error) || '')); return; }
          openAddPanel = null;
          refresh();
        }).catch(function(){ showBanner('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง'); });
      };
    }

    if (!expenses.length){
      root.appendChild(emptyState('ยังไม่มีรายการค่าใช้จ่าย','กดปุ่ม "+ เพิ่มรายการค่าใช้จ่าย" ด้านบนเพื่อเริ่มบันทึก'));
      return;
    }

    var sorted = expenses.slice().sort(function(a,b){
      var da = parseEpochDaySetting(a.Date);
      var db = parseEpochDaySetting(b.Date);
      if (da==null && db==null) return 0;
      if (da==null) return 1;
      if (db==null) return -1;
      return db - da; // ใหม่สุดก่อน
    });

    var list = el('div','list card');
    sorted.forEach(function(item,i){
      var row = el('div','expense-item');
      if (i>0) row.style.borderTop = '1px solid var(--border)';
      var dEpoch = parseEpochDaySetting(item.Date);
      var dateLabel = dEpoch!=null ? fmtDateTh(epochDayToDate(dEpoch)) : '—';
      var priceNum = parseFloat(String(item.Price).replace(/,/g,''));
      var priceLabel = isFinite(priceNum) ? '฿'+priceNum.toLocaleString('th-TH') : '฿'+escapeHtml(String(item.Price||''));
      row.innerHTML =
        '<div class="expense-main">'+
          '<span class="expense-date">'+escapeHtml(dateLabel)+'</span>'+
          (item.Category ? '<span class="expense-cat">'+escapeHtml(item.Category)+'</span>' : '')+
        '</div>'+
        '<span class="expense-price">'+priceLabel+'</span>'+
        '<button class="icon-btn del-btn" type="button" aria-label="ลบ" title="ลบ">'+trashIcon()+'</button>';
      row.querySelector('.del-btn').onclick = function(){
        apiPost('deleteExpense', {id:item.ID}).then(refresh);
      };
      list.appendChild(row);
    });
    root.appendChild(list);
  }

  function emptyState(title, sub){
    return el('div','empty-state', '<strong>'+title+'</strong><span>'+sub+'</span>');
  }
  function trashIcon(){
    return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>';
  }
  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }

  // ---------------- Boot ----------------
  function boot(){
    document.querySelectorAll('.tab-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        activeTab = btn.getAttribute('data-tab');
        openAddPanel = null;
        document.querySelectorAll('.tab-btn').forEach(function(b){ b.setAttribute('data-active', b===btn); });
        renderView();
      });
    });

    if (!apiUrl || !who){
      document.getElementById('setup-screen').hidden = false;
      var dadBtn = document.querySelector('.who-btn[data-role="dad"]');
      var momBtn = document.querySelector('.who-btn[data-role="mom"]');
      var selectedRole = null;
      dadBtn.onclick = function(){ selectedRole='dad'; dadBtn.setAttribute('data-selected','true'); momBtn.setAttribute('data-selected','false'); };
      momBtn.onclick = function(){ selectedRole='mom'; momBtn.setAttribute('data-selected','true'); dadBtn.setAttribute('data-selected','false'); };
      document.getElementById('setup-save-btn').onclick = function(){
        var url = document.getElementById('api-url-input').value.trim();
        var errEl = document.getElementById('setup-error');
        errEl.hidden = true;
        if (!url || !selectedRole){
          errEl.textContent = 'กรุณาใส่ URL และเลือกว่าเครื่องนี้เป็นของพ่อหรือแม่';
          errEl.hidden = false;
          return;
        }
        apiUrl = url; who = selectedRole;
        fetch(apiUrl + '?action=getAll').then(function(r){ return r.json(); }).then(function(data){
          if (!data || !data.ok) throw new Error('bad response');
          try { localStorage.setItem(LS_URL, apiUrl); localStorage.setItem(LS_WHO, who); } catch(e){}
          document.getElementById('setup-screen').hidden = true;
          document.getElementById('main-app').hidden = false;
          refresh();
        }).catch(function(){
          errEl.textContent = 'เชื่อมต่อไม่สำเร็จ ตรวจสอบว่า URL ถูกต้องและ deploy เป็น "Anyone with the link" แล้ว';
          errEl.hidden = false;
        });
      };
      return;
    }

    document.getElementById('main-app').hidden = false;
    refresh();
  }

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
